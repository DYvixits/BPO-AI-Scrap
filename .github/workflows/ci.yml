name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Most of the suite runs against SQLite (tests/conftest.py) and needs no
    # service container. Row-Level Security has no SQLite equivalent at all
    # (see app/core/database.py) — tests/test_rls.py needs a real Postgres,
    # which this container provides; without it that file just self-skips
    # (see its own module docstring), so this service isn't load-bearing for
    # the rest of the suite, only for actually exercising RLS in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bpo
          POSTGRES_PASSWORD: bpo
          POSTGRES_DB: bpo_ai_scrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpo -d bpo_ai_scrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Apply migrations (for RLS tests)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://bpo:bpo@localhost:5432/bpo_ai_scrap
        run: alembic upgrade head
      - name: Create least-privilege app role (for RLS tests)
        # The postgres:16-alpine image's POSTGRES_USER ("bpo") is created as
        # a SUPERUSER. Postgres superusers unconditionally bypass Row-Level
        # Security — ENABLE/FORCE ROW LEVEL SECURITY have no effect on them —
        # so tests/test_rls.py connecting as "bpo" would silently exercise
        # nothing. "bpo_app" is an ordinary, non-superuser role that RLS
        # actually applies to, mirroring the role separation any real
        # deployment needs between the schema owner (runs migrations) and
        # the role serving live traffic.
        run: |
          PGPASSWORD=bpo psql -h localhost -U bpo -d bpo_ai_scrap -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'bpo_app') THEN
              CREATE ROLE bpo_app LOGIN PASSWORD 'bpo_app';
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO bpo_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bpo_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bpo_app;
          SQL
      - name: Test (pytest)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bpo_app:bpo_app@localhost:5432/bpo_ai_scrap
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Build (type-check + vite build)
        working-directory: frontend
        run: npm run build
