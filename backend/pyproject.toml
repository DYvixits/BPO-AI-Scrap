[project]
name = "bpo-ai-scrap-backend"
version = "0.1.0"
description = "AI Research & Web Intelligence Platform — backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "email-validator>=2.1,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "redis>=5.0,<6.0",
  "arq>=0.26,<1.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.2,<6.0",
  "trafilatura>=1.12,<2.0",
  "passlib[bcrypt]>=1.7,<2.0",
  # passlib 1.7.4's bcrypt backend self-test crashes against bcrypt>=4.1
  # (bcrypt dropped the `__about__` attribute passlib probes, and its
  # wrap-bug detection now raises instead of truncating on a >72-byte probe
  # string). Pin to the last known-compatible bcrypt release.
  "bcrypt==4.0.1",
  "pyjwt>=2.8,<3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Matches requires-python above (>=3.11), not the Docker image's 3.12 — local
# dev runs on 3.11 (see ARCHITECTURE.md risk table), so lint must not suggest
# 3.12-only syntax (e.g. PEP 695 generics) that would break it.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. as argument defaults is the framework's
# own idiom, not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
